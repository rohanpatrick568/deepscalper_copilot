name: quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r algo_trader/requirements.txt
      - run: python -m pip check
      - run: python -c "import alpaca, gymnasium, lumibot, numpy, pandas, torch; print('runtime imports OK')"
      - run: python -m compileall -q algo_trader
      - run: python -m pytest -q
        working-directory: algo_trader
