name: Push Trained Weights

# Triggered manually from the Actions tab, or automatically after pushing a
# branch whose name starts with "weights/".
on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for the weight files"
        required: false
        default: "chore: update trained weights"
  push:
    branches:
      - "weights/**"

permissions:
  contents: write   # Required to push commits

jobs:
  push-weights:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository with full history and write access
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Set up Python (only needed if you run a validation script)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Verify that all 100 weight files are present
      - name: Verify weight files
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path

          weights_dir = Path("algo_trader/weights")
          pth_files   = sorted(weights_dir.glob("*.pth"))

          print(f"Found {len(pth_files)} .pth files:")
          for f in pth_files:
              size_kb = f.stat().st_size // 1024
              print(f"  {f.name}  ({size_kb} KB)")

          expected = 100
          if len(pth_files) < expected:
              print(f"\nERROR: Expected {expected} weight files, found {len(pth_files)}.")
              sys.exit(1)

          print(f"\n✅ All {len(pth_files)} weight files verified.")
          EOF

      # 4. Configure git identity for the automated commit
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 5. Stage and commit any new or modified weight files
      - name: Commit weight files
        run: |
          git add algo_trader/weights/*.pth
          if git diff --staged --quiet; then
            echo "No new weight files to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d-%H%M")
            MSG="${{ github.event.inputs.commit_message || 'chore: update trained weights' }} [${TIMESTAMP}]"
            git commit -m "$MSG"
            git push origin HEAD:main
            echo "✅ Weight files pushed."
          fi

      # 6. Create a timestamped lightweight tag for this weight release
      - name: Tag weight release
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H%M")
          TAG="weights-${TIMESTAMP}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tag created: $TAG"
